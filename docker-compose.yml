services:
  web:
    build: .
    ports:
      # 同一サーバーで複数アプリを並走させるため WEB_PORT で
      # ホスト側ポートを切り替え可能にする (デプロイ自動化の
      # `WEB_PORT=<port> docker compose up` と整合する形)。
      - "${WEB_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/bloom
      # 以下は .env ファイル(git管理外)で設定する
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を .env に設定してください}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_NAME: ${SITE_NAME:-bloom}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bloom
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db_data:
