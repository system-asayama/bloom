{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>{{ site_name }}</h1>
  <p>ようこそ。お気軽にお立ち寄りください。</p>
</section>

<section>
  <h2>新着ブログ</h2>
  {% for post in posts %}
    {% include "_post_card.html" %}
  {% else %}
    <p class="muted">まだ記事はありません。</p>
  {% endfor %}
  {% if posts %}
    <p><a href="{{ url_for('blog_list') }}">ブログ一覧へ &rarr;</a></p>
  {% endif %}
</section>
{% endblock %}
