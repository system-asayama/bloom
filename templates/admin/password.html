{% extends "base.html" %}
{% block title %}パスワード変更 | {{ site_name }}{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<h1>パスワード変更</h1>
<form method="post" class="form narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>現在のパスワード<input type="password" name="current_password" autocomplete="current-password" required></label>
  <label>新しいパスワード(8文字以上)<input type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
  <label>新しいパスワード(確認)<input type="password" name="new_password_confirm" autocomplete="new-password" required></label>
  <button type="submit">変更する</button>
</form>
{% endblock %}
