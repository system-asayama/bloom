<div class="admin-nav">
  {% for endpoint, label in [
    ('admin_posts', 'ブログ'), ('admin_store', '店舗情報'), ('admin_prices', '料金'),
    ('admin_casts', 'キャスト'), ('admin_gallery', 'ギャラリー'), ('change_password', 'パスワード変更'),
  ] %}
    <a href="{{ url_for(endpoint) }}" class="{{ 'active' if request.endpoint == endpoint }}">{{ label }}</a>
  {% endfor %}
  <form method="post" action="{{ url_for('logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="link">ログアウト</button>
  </form>
</div>
