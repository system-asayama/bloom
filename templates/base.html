<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('index') }}">{{ site_name }}</a>
    <nav>
      <a href="{{ url_for('index') }}">トップ</a>
      <a href="{{ url_for('blog_list') }}">ブログ</a>
      {% if is_admin %}
        <a href="{{ url_for('admin_posts') }}">管理画面</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">&copy; {{ site_name }}</footer>
</body>
</html>
