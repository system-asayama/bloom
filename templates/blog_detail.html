{% extends "base.html" %}
{% block title %}{{ post.title }} | {{ site_name }}{% endblock %}
{% block content %}
<article class="post">
  {% if not post.published %}<p class="badge">下書き(公開されていません)</p>{% endif %}
  <time>{{ post.created_at.strftime('%Y.%m.%d') }}</time>
  <h1>{{ post.title }}</h1>
  <div class="post-body">{{ post.body|nl2br }}</div>
</article>
<p><a href="{{ url_for('blog_list') }}">&larr; ブログ一覧へ</a></p>
{% endblock %}
